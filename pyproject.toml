[project]
name = "scrapbook"
version = "1.0.0"
description = "Simple scraping library."
keywords = ["html", "parse", "scraping"]
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Masashi Onogawa", email = "masashi.onogawa@wamw.jp" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["parsel>=1.9.1", "python-dateutil>=2.9.0.post0"]

[project.urls]
Homepage = "https://github.com/odoku/Scrapbook"
Documentation = "https://scrapbook.readthedocs.io/"
Repository = "https://github.com/odoku/Scrapbook"
Issues = "https://github.com/odoku/Scrapbook/issues"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.3",
    "ruff>=0.7.2",
    "tox>=4.23.2",
    "tox-uv>=1.16.0",
    "types-python-dateutil>=2.9.0.20241003",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
plugins = []
show_column_numbers = true
ignore_missing_imports = true
exclude = []

[tool.ruff]
target-version = "py39"
line-length = 120
indent-width = 4
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = ["B", "C", "E", "F", "W", "B9"]
ignore = ["E203", "E266"]
exclude = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
exclude = []

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=xml"
python_files = "*.py"

[tool.tox]
envlist = ["py39", "py310", "py311", "py312", "py313", "pypy39", "pypy310"]
isolated_build = true

[tool.tox.env_run_base]
description = "Run test under {base_python}"
runner = "uv-venv-lock-runner"
with_dev = true
commands = [["pytest"]]
